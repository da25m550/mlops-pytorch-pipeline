# =============================================================================
# k8s/configmap.yaml
# Training configuration mounted into the training Job at /app/configs/.
# Edit values here to change hyperparameters without rebuilding the image.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
    component: training
data:
  training_config.yaml: |
    model:
      architecture: resnet18
      num_classes: 10
      pretrained: false

    training:
      epochs: 1
      batch_size: 128
      learning_rate: 0.001
      weight_decay: 0.0001
      early_stopping_patience: 5

    data:
      dataset: cifar10
      data_dir: /app/data

    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt
