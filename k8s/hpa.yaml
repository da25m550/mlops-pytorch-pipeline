# =============================================================================
# k8s/hpa.yaml
# HorizontalPodAutoscaler for the model-serving Deployment.
#
# Scales replicas between 2 and 10 based on CPU utilisation.
# Requires the Kubernetes Metrics Server to be installed:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Apply:
#   kubectl apply -f k8s/hpa.yaml
#
# Monitor:
#   kubectl get hpa -n ml-training
#   kubectl describe hpa model-serving-hpa -n ml-training
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-serving-hpa
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
    component: serving
spec:
  # ── Target deployment ────────────────────────────────────────────────────
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving

  # ── Replica bounds ───────────────────────────────────────────────────────
  minReplicas: 2
  maxReplicas: 10

  # ── Scaling metrics ──────────────────────────────────────────────────────
  metrics:
    # Scale up when average CPU utilisation exceeds 70 %
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale up when average memory utilisation exceeds 80 %
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # ── Scaling behaviour ────────────────────────────────────────────────────
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # Wait 60 s before scaling up again
      policies:
        - type: Pods
          value: 2                       # Add at most 2 pods per scale event
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1                       # Remove at most 1 pod per scale event
          periodSeconds: 120
