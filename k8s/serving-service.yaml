# =============================================================================
# k8s/serving-service.yaml
# Kubernetes Service that exposes the model-serving Deployment.
#
# ClusterIP (default): accessible only within the cluster.
# Change type to LoadBalancer for cloud clusters (GKE, EKS, AKS).
#
# Apply:
#   kubectl apply -f k8s/serving-service.yaml
#
# Port-forward for local testing:
#   kubectl port-forward svc/model-serving 8080:80 -n ml-training
#   curl http://localhost:8080/health
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
    component: serving
  annotations:
    # Uncomment for AWS NLB on EKS:
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  # ── Service type ────────────────────────────────────────────────────────────
  # Use ClusterIP for in-cluster access (e.g., via Ingress or port-forward).
  # Change to LoadBalancer if you want a cloud-provisioned external IP.
  type: ClusterIP

  # ── Selector ────────────────────────────────────────────────────────────────
  selector:
    app: model-serving

  # ── Ports ───────────────────────────────────────────────────────────────────
  ports:
    - name: http
      protocol: TCP
      port: 80            # Service port (external-facing within cluster)
      targetPort: 8080    # Container port defined in serving-deployment.yaml
