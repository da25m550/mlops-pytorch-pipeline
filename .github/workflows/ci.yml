# =============================================================================
# .github/workflows/ci.yml
# Continuous Integration pipeline for mlops-pytorch-pipeline.
#
# Triggers:
#   - Push to main or develop branches
#   - Pull requests targeting main or develop
#
# Jobs:
#   1. lint        – ruff + black formatting check
#   2. test        – pytest unit tests (CPU only, no dataset download)
#   3. build-train – docker build for the training image
#   4. build-serve – docker build for the serving image
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mlops-pytorch-pipeline

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff==0.5.5 black==24.8.0

      - name: Run ruff (linter)
        run: ruff check src/ tests/

      - name: Run black (formatter check)
        run: black --check src/ tests/

  # ---------------------------------------------------------------------------
  # Job 2: Unit tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements/train.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Job 3: Build training Docker image
  # ---------------------------------------------------------------------------
  build-train:
    name: Build Training Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build training image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          tags: mlops-train:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 4: Build serving Docker image
  # ---------------------------------------------------------------------------
  build-serve:
    name: Build Serving Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve
          push: false
          tags: mlops-serve:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 5: Validate Kubernetes manifests (dry-run)
  # ---------------------------------------------------------------------------
  validate-k8s:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Validate manifests (dry-run client)
        run: |
          for f in k8s/*.yaml; do
            echo "Validating $f ..."
            kubectl apply --dry-run=client -f "$f" 2>&1 | grep -v "^Warning" || true
          done
        # Note: dry-run=client validates YAML structure without a live cluster.
        # Some resources (e.g., PVCs) may warn about missing storage classes —
        # that is expected in CI and does not indicate a real error.
        continue-on-error: true
